[workspace]
members = [
    "crates/sift-embedding-kernels",
    "crates/sift-embedding-runtime",
]
resolver = "3"

[package]
name = "sift"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bench]]
name = "embedding_gemma"
harness = false
test = false

[features]
default = []
cuda = ["sift-embedding-runtime/cuda"]
rocm = ["sift-embedding-runtime/rocm"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
encoding_rs = "0.8.35"
sift-embedding-runtime = { path = "crates/sift-embedding-runtime" }
dotenvy = "0.15"
hf-hub = { version = "1.0.0", features = ["blocking"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "json", "rustls", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tokenizers = "0.22.2"
tower-http = { version = "0.7.0", features = ["cors", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
trafilatura = { version = "0.3.0", features = ["markdown"] }
url = "2.5.8"
